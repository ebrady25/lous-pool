// ═══════════════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════════════
const CONFIG = {
  LEADERBOARD_URL: "data/leaderboard.json",
  FRIENDS: [
    "Eric Southard", "John Hughes", "Matt White",
    "Aaron White", "Connor White", "Malcolm White",
    "Great White!", "Joe Jurkiewicz"
  ],
};

// ═══════════════════════════════════════════════════════════════
// CLUBHOUSE CSS
// ═══════════════════════════════════════════════════════════════
const clubCSS = `
.dir-club {
  --paper: #f6f1e3;
  --paper-deep: #ede5cf;
  --paper-line: #d5cdb4;
  --forest: #14352a;
  --forest-deep: #0c2018;
  --ink: #1c1d18;
  --ink-soft: #5b5b50;
  --ink-faint: #908a78;
  --brass: #b89b5e;
  --brick: #9d4d3a;
  --red: #b03a2e;
  --green-good: #2f6b3f;
  --hero-bg: var(--forest-deep);
  --hero-fg: var(--paper);
  --hero-sub: rgba(246,241,227,0.55);
  --hero-border: rgba(184,155,94,0.35);
  --hero-divider: rgba(184,155,94,0.15);
}
.dir-club.dark {
  --paper: #100f0c;
  --paper-deep: #1a1813;
  --paper-line: #2a261f;
  --forest: #142b22;
  --forest-deep: #0a1812;
  --ink: #f2ead4;
  --ink-soft: #b8b09a;
  --ink-faint: #7d7666;
  --brass: #d4b46c;
  --brick: #c7553f;
  --red: #e25a48;
  --green-good: #6ec27a;
  --hero-bg: #1a1813;
  --hero-fg: #f2ead4;
  --hero-sub: rgba(242,234,212,0.55);
  --hero-border: rgba(212,180,108,0.4);
  --hero-divider: rgba(212,180,108,0.18);
}
.dir-club {
  background: var(--paper);
  color: var(--ink);
  font-family: 'Inter', system-ui, sans-serif;
  font-feature-settings: "ss01" on, "cv11" on, "tnum" on;
  width: 100%; height: 100%;
  overflow: hidden;
  position: relative;
  letter-spacing: -0.005em;
}
.dir-club .stack { height: 100%; display: flex; flex-direction: column; }
.dir-club .scroll { flex: 1; overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; }
.dir-club .scroll::-webkit-scrollbar { display: none; }

.dir-club .top {
  padding: 20px 22px 14px;
  background: var(--paper);
  position: sticky; top: 0; z-index: 5;
  border-bottom: 1px solid var(--paper-line);
}
.dir-club .top-row {
  display: flex; align-items: center; justify-content: space-between;
}
.dir-club .brand {
  display: flex; align-items: baseline; gap: 8px;
}
.dir-club .brand .mark {
  font-family: 'Fraunces', serif;
  font-weight: 600;
  font-size: 22px;
  letter-spacing: -0.02em;
  color: var(--forest-deep);
  font-style: italic;
}
.dir-club.dark .brand .mark { color: var(--brass); }
.dir-club .brand .est {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.18em;
  color: var(--ink-faint);
  text-transform: uppercase;
}
.dir-club .top-actions {
  display: flex; align-items: center; gap: 10px;
}
.dir-club .theme-btn {
  width: 32px; height: 32px;
  border: 1px solid var(--paper-line);
  background: var(--paper-deep);
  border-radius: 50%;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
  transition: all 0.2s;
}
.dir-club .theme-btn:hover { border-color: var(--brass); }
.dir-club .pill {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  padding: 4px 8px;
  border: 1px solid var(--ink);
  color: var(--ink);
  background: var(--paper-deep);
  display: inline-flex; align-items: center; gap: 6px;
}
.dir-club.dark .pill { border-color: var(--brass); color: var(--brass); background: rgba(212,180,108,0.05); }
.dir-club .pill .dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--red); display: inline-block;
  box-shadow: 0 0 0 2px rgba(176,58,46,0.18);
  animation: clubPulse 1.6s ease-in-out infinite;
}
@keyframes clubPulse { 0%,100%{opacity:1} 50%{opacity:0.45} }

.dir-club .masthead {
  margin-top: 10px;
  display: flex; align-items: flex-end; justify-content: space-between;
  padding-bottom: 12px;
}
.dir-club .masthead h1 {
  font-family: 'Fraunces', serif;
  font-weight: 500;
  font-size: 28px;
  line-height: 0.95;
  letter-spacing: -0.035em;
  margin: 0;
  color: var(--forest-deep);
}
.dir-club.dark .masthead h1 { color: var(--ink); }
.dir-club .masthead h1 em {
  font-style: italic; color: var(--brass); font-weight: 500;
}
.dir-club .masthead .meta {
  text-align: right;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.16em;
  color: var(--ink-soft);
  text-transform: uppercase;
  line-height: 1.6;
}
.dir-club .masthead .meta b { color: var(--ink); font-weight: 600; }

/* Tabs */
.dir-club .tabs-row {
  display: flex;
  border-bottom: 1px solid var(--paper-line);
  background: var(--paper);
}
.dir-club .tab {
  flex: 1;
  padding: 12px 8px;
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink-faint);
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  display: flex; align-items: center; justify-content: center; gap: 6px;
}
.dir-club .tab:hover { color: var(--ink-soft); }
.dir-club .tab.on {
  color: var(--ink);
  font-weight: 500;
}
.dir-club .tab.on::after {
  content: '';
  position: absolute;
  bottom: -1px;
  left: 20%; right: 20%;
  height: 2px;
  background: var(--brass);
}
.dir-club .tab .live-dot {
  width: 5px; height: 5px;
  background: var(--red);
  border-radius: 50%;
  animation: clubPulse 1.6s ease-in-out infinite;
}

/* You-pin */
.dir-club .you-pin {
  margin: 14px 22px 0;
  padding: 12px 14px;
  background: var(--hero-bg);
  color: var(--hero-fg);
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-radius: 2px;
  position: relative;
}
.dir-club .you-pin::before {
  content: '';
  position: absolute;
  inset: 3px;
  border: 1px solid var(--hero-border);
  pointer-events: none;
}
.dir-club .you-tag {
  font-family: 'DM Mono', monospace;
  font-size: 8px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--brass);
}
.dir-club .you-name {
  font-family: 'Fraunces', serif;
  font-style: italic;
  font-size: 18px;
  color: var(--hero-fg);
  margin-top: 2px;
}
.dir-club .you-back {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--hero-sub);
  letter-spacing: 0.1em;
  margin-top: 2px;
}
.dir-club .you-sc {
  font-family: 'Fraunces', serif;
  font-size: 32px;
  font-weight: 500;
  color: var(--brass);
}
.dir-club .you-sc.under { color: var(--green-good); }
.dir-club .you-sc.over { color: var(--brick); }
.dir-club .you-rank {
  font-family: 'Fraunces', serif;
  font-size: 24px;
  color: var(--hero-fg);
}

/* Section title */
.dir-club .section-title {
  padding: 14px 22px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.dir-club .section-title h2 {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--ink-soft);
}
.dir-club .friend-chip {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.12em;
  padding: 4px 8px;
  border: 1px solid var(--paper-line);
  color: var(--ink-faint);
  cursor: pointer;
  display: flex; align-items: center; gap: 4px;
  transition: all 0.2s;
}
.dir-club .friend-chip:hover { border-color: var(--ink-soft); }
.dir-club .friend-chip.on {
  border-color: var(--brass);
  color: var(--brass);
  background: rgba(184,155,94,0.08);
}
.dir-club .friend-chip .star { font-size: 11px; }

/* Leaderboard rows */
.dir-club .lb {
  padding: 0 22px 0;
}
.dir-club .lb-row {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--paper-line);
  cursor: pointer;
  transition: background 0.15s;
}
.dir-club .lb-row:hover { background: var(--paper-deep); }
.dir-club .lb-row.top1 { background: rgba(184,155,94,0.06); }
.dir-club .lb-row.is-fav { background: rgba(47,107,63,0.06); }
.dir-club.dark .lb-row.is-fav { background: rgba(110,199,122,0.08); }
.dir-club .lb-row .pos {
  width: 32px;
  font-family: 'Fraunces', serif;
  font-size: 16px;
  color: var(--ink-soft);
  text-align: center;
}
.dir-club .lb-row.top1 .pos { color: var(--brass); font-weight: 600; }
.dir-club .lb-row .who {
  flex: 1;
  min-width: 0;
}
.dir-club .lb-row .nm {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dir-club .lb-row .sub {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--ink-faint);
  letter-spacing: 0.08em;
  margin-top: 1px;
}
.dir-club .lb-row .fav-btn {
  font-size: 14px;
  color: var(--ink-faint);
  cursor: pointer;
  padding: 4px;
  transition: color 0.15s;
}
.dir-club .lb-row .fav-btn:hover { color: var(--brass); }
.dir-club .lb-row .fav-btn.on { color: var(--brass); }
.dir-club .lb-row .delta {
  width: 24px;
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--ink-faint);
}
.dir-club .lb-row .score {
  width: 48px;
  text-align: right;
  font-family: 'Fraunces', serif;
  font-size: 18px;
  font-weight: 500;
}
.dir-club .lb-row .score.under { color: var(--green-good); }
.dir-club .lb-row .score.over { color: var(--brick); }
.dir-club .lb-row .score.even { color: var(--ink-soft); }

/* Season pts display */
.dir-club .lb-row .season-pts {
  font-family: 'Fraunces', serif;
  font-size: 16px;
  font-weight: 500;
  color: var(--ink);
  text-align: right;
}
.dir-club .lb-row .season-back {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--ink-faint);
  display: block;
  text-align: right;
}

/* Live PGA leaderboard */
.dir-club .live-lb {
  padding: 0 22px;
}
.dir-club .lp-row {
  display: flex;
  align-items: center;
  padding: 8px 0;
  border-bottom: 1px solid var(--paper-line);
}
.dir-club .lp-row.flash { background: rgba(184,155,94,0.12); }
.dir-club .lp-row.is-mine { background: rgba(47,107,63,0.08); }
.dir-club .lp-row.is-friend { background: rgba(184,155,94,0.05); }
.dir-club .lp-pos {
  width: 36px;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--ink-soft);
}
.dir-club .lp-name {
  flex: 1;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
}
.dir-club .lp-name .mine-star { color: var(--green-good); margin-left: 4px; }
.dir-club .lp-name .friend-star { color: var(--brass); margin-left: 4px; }
.dir-club .lp-thru {
  width: 32px;
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--ink-faint);
}
.dir-club .lp-today {
  width: 40px;
  text-align: right;
  font-family: 'Fraunces', serif;
  font-size: 14px;
}
.dir-club .lp-today.under { color: var(--green-good); }
.dir-club .lp-today.over { color: var(--brick); }
.dir-club .lp-tot {
  width: 44px;
  text-align: right;
  font-family: 'Fraunces', serif;
  font-size: 16px;
  font-weight: 500;
}
.dir-club .lp-tot.under { color: var(--green-good); }
.dir-club .lp-tot.over { color: var(--brick); }

/* Hero (team detail) */
.dir-club .hero {
  background: var(--hero-bg);
  color: var(--hero-fg);
  padding: 20px 22px 24px;
  position: relative;
}
.dir-club .hero .back {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--brass);
  cursor: pointer;
  margin-bottom: 12px;
}
.dir-club .hero .back:hover { text-decoration: underline; }
.dir-club .hero h1 {
  font-family: 'Fraunces', serif;
  font-size: 28px;
  font-weight: 500;
  font-style: italic;
  margin-bottom: 4px;
}
.dir-club .hero .alias {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.15em;
  color: var(--hero-sub);
  text-transform: uppercase;
}
.dir-club .hero .nums {
  display: flex;
  gap: 24px;
  margin-top: 16px;
}
.dir-club .hero .num .k {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--hero-sub);
}
.dir-club .hero .num .v {
  font-family: 'Fraunces', serif;
  font-size: 36px;
  font-weight: 500;
  color: var(--brass);
  margin-top: 2px;
}
.dir-club .hero .num.lg .v { font-size: 42px; }
.dir-club .hero .num .sub {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--hero-sub);
  margin-top: 2px;
}
.dir-club .hero .fav-toggle {
  margin-top: 16px;
  padding: 8px 14px;
  border: 1px solid var(--hero-border);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--hero-sub);
  cursor: pointer;
  transition: all 0.2s;
}
.dir-club .hero .fav-toggle:hover { border-color: var(--brass); color: var(--brass); }
.dir-club .hero .fav-toggle.on { border-color: var(--brass); color: var(--brass); background: rgba(184,155,94,0.1); }
.dir-club .hero .fav-toggle .star { font-size: 14px; }

/* Player card */
.dir-club .player-card {
  margin: 0 22px;
  padding: 14px 0;
  border-bottom: 1px solid var(--paper-line);
}
.dir-club .pc-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.dir-club .pc-nm {
  font-size: 15px;
  font-weight: 500;
  color: var(--ink);
}
.dir-club .pc-pos {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--ink-faint);
  margin-top: 2px;
}
.dir-club .pc-sc {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 500;
}
.dir-club .pc-rounds {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}
.dir-club .pc-rounds .r {
  flex: 1;
  text-align: center;
  padding: 6px 0;
  background: var(--paper-deep);
  border: 1px solid var(--paper-line);
}
.dir-club .pc-rounds .r.best {
  border-color: var(--brass);
  background: rgba(184,155,94,0.08);
}
.dir-club .pc-rounds .r .k {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--ink-faint);
}
.dir-club .pc-rounds .r .v {
  font-family: 'Fraunces', serif;
  font-size: 16px;
  color: var(--ink);
  margin-top: 2px;
}
.dir-club .pc-rounds .r.best .v { color: var(--brass); }

/* Loading */
.dir-club .loading {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 200px;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.15em;
  color: var(--ink-faint);
  text-transform: uppercase;
}

/* Bottom Sheet */
.dir-club .sheet-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  z-index: 100;
  opacity: 0;
  transition: opacity 0.25s ease;
  pointer-events: none;
}
.dir-club .sheet-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.dir-club .sheet {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  background: var(--paper);
  border-radius: 16px 16px 0 0;
  z-index: 101;
  transform: translateY(100%);
  transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
  max-height: 70vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.dir-club .sheet.open {
  transform: translateY(0);
}
.dir-club .sheet-handle {
  padding: 12px;
  display: flex;
  justify-content: center;
  flex-shrink: 0;
}
.dir-club .sheet-handle::before {
  content: '';
  width: 36px;
  height: 4px;
  background: var(--paper-line);
  border-radius: 2px;
}
.dir-club .sheet-header {
  padding: 0 20px 14px;
  border-bottom: 1px solid var(--paper-line);
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
}
.dir-club .sheet-header .sh-left {}
.dir-club .sheet-header .sh-name {
  font-family: 'Fraunces', serif;
  font-size: 22px;
  font-weight: 500;
  font-style: italic;
  color: var(--ink);
}
.dir-club .sheet-header .sh-sub {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.12em;
  color: var(--ink-faint);
  margin-top: 2px;
}
.dir-club .sheet-header .sh-score {
  text-align: right;
}
.dir-club .sheet-header .sh-score .big {
  font-family: 'Fraunces', serif;
  font-size: 32px;
  font-weight: 500;
}
.dir-club .sheet-header .sh-score .big.under { color: var(--green-good); }
.dir-club .sheet-header .sh-score .big.over { color: var(--brick); }
.dir-club .sheet-header .sh-score .big.even { color: var(--ink-soft); }
.dir-club .sheet-header .sh-score .rank {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--ink-faint);
}
.dir-club .sheet-body {
  padding: 14px 20px;
  overflow-y: auto;
  flex: 1;
}
.dir-club .sheet-player {
  display: flex;
  align-items: center;
  padding: 10px 0;
  border-bottom: 1px solid var(--paper-line);
}
.dir-club .sheet-player:last-child { border-bottom: none; }
.dir-club .sheet-player .sp-pos {
  width: 40px;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--ink-soft);
}
.dir-club .sheet-player .sp-name {
  flex: 1;
  font-size: 14px;
  font-weight: 500;
  color: var(--ink);
}
.dir-club .sheet-player .sp-name .status {
  font-family: 'DM Mono', monospace;
  font-size: 9px;
  color: var(--brick);
  margin-left: 6px;
}
.dir-club .sheet-player .sp-thru {
  width: 36px;
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--ink-faint);
}
.dir-club .sheet-player .sp-score {
  width: 44px;
  text-align: right;
  font-family: 'Fraunces', serif;
  font-size: 18px;
  font-weight: 500;
}
.dir-club .sheet-player .sp-score.under { color: var(--green-good); }
.dir-club .sheet-player .sp-score.over { color: var(--brick); }
.dir-club .sheet-footer {

function useTheme() {
  const [theme, setThemeRaw] = React.useState(() => {
    try { return localStorage.getItem('lous-pool-theme') || 'light'; } catch { return 'light'; }
  });
  const setTheme = React.useCallback((t) => {
    try { localStorage.setItem('lous-pool-theme', t); } catch {}
    setThemeRaw(t);
  }, []);
  const toggle = React.useCallback(() => {
    setTheme(theme === 'light' ? 'dark' : 'light');
  }, [theme, setTheme]);
  return [theme, toggle];
}

function useFavoriteTeam() {
  const [fav, setFavRaw] = React.useState(() => {
    try { return localStorage.getItem('lous-pool-fav') || null; } catch { return null; }
  });
  const setFav = React.useCallback((owner) => {
    try {
      if (owner) localStorage.setItem('lous-pool-fav', owner);
      else localStorage.removeItem('lous-pool-fav');
    } catch {}
    setFavRaw(owner);
  }, []);
  return [fav, setFav];
}

function useLiveFlash(maxIdx, intervalMs = 4200) {
  const [flashIdx, setFlash] = React.useState(-1);
  React.useEffect(() => {
    if (maxIdx < 1) return;
    let cancelled = false;
    const tick = () => {
      if (cancelled) return;
      const idx = Math.floor(Math.pow(Math.random(), 1.6) * maxIdx);
      setFlash(idx);
      setTimeout(() => { if (!cancelled) setFlash(-1); }, 1800);
    };
    const first = setTimeout(tick, 1200);
    const interval = setInterval(tick, intervalMs);
    return () => { cancelled = true; clearTimeout(first); clearInterval(interval); };
  }, [maxIdx, intervalMs]);
  return flashIdx;
}

function useCountUp(target, duration = 900) {
  const [v, setV] = React.useState(0);
  React.useEffect(() => {
    if (target === 0) { setV(0); return; }
    const start = performance.now();
    let raf;
    const step = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      setV(target * eased);
      if (t < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return v;
}

// DATA ADAPTER - Maps leaderboard.json to LP_DATA format
// ═══════════════════════════════════════════════════════════════
function buildLPData(raw) {
  if (!raw || !raw.teams) return null;
  
  const fmt = (toPar) => {
    if (toPar === null || toPar === undefined) return "—";
    if (toPar === 0) return "E";
    return toPar > 0 ? `+${toPar}` : `${toPar}`;
  };
  
  const isFriend = (name) => CONFIG.FRIENDS.some(f => 
    name.toLowerCase().includes(f.toLowerCase())
  );
  
  // Sort teams for weekly ranking
  const weekSorted = [...raw.teams].sort((a, b) => 
    (a.team_to_par ?? 999) - (b.team_to_par ?? 999)
  );
  
  // Sort teams for season ranking  
  const seasonSorted = [...raw.teams].sort((a, b) => 
    (a.season_pts ?? 99999) - (b.season_pts ?? 99999)
  );
  
  // Build week array
  const week = weekSorted.map((t, i) => ({
    owner: t.owner,
    rank: i + 1,
    toPar: t.team_to_par ?? 0,
    season: t.season_pts ?? 0,
    seasonRank: t.season_rank ?? 0,
    picks: t.players?.map(p => p.name) || [],
    players: t.players || [],
    isFriend: isFriend(t.owner),
    mc: t.mc_count || 0,
  }));
  
  // Build season array
  const season = seasonSorted.map((t, i) => ({
    owner: t.owner,
    rank: i + 1,
    pts: t.season_pts ?? 0,
    weekRank: t.weekly_rank ?? 0,
    weekToPar: t.team_to_par ?? 0,
    isFriend: isFriend(t.owner),
  }));
  
  // Build live players array
  const live = (raw.live_players || []).map(p => ({
    name: p.name,
    pos: p.position || p.fin_text || "",
    thru: p.thru ?? "",
    today: p.today ?? 0,
    to: p.current_score ?? 0,
    r1: p.r1,
    r2: p.r2,
    r3: p.r3,
    r4: p.r4,
  }));
  
  // Event info
  const event = {
    name: raw.event || "Tournament",
    course: raw.course || "TPC",
    par: raw.course_par || 72,
    cut: raw.cut_line ? (raw.cut_line - (raw.course_par || 72) * 2) : null,
    round: raw.current_round || 1,
    status: raw.status || "pre",
    week: 9, // PGA Championship is Week 9
    totalWeeks: 15,
    teams: raw.total_teams || 100,
    updatedAt: raw.updated_at || raw.last_updated,
  };
  
  return {
    fmt,
    week,
    season,
    live,
    event,
    raw,
  };
}

        <div className="sheet-header">
          <div className="sh-left">
            <div className="sh-name">{team.owner}</div>
            <div className="sh-sub">
              #{team.rank} of 100 · {team.mc > 0 ? `${team.mc} MC · ` : ''}Season #{team.seasonRank}
            </div>
          </div>
          <div className="sh-score">
            <div className={`big ${cls}`}>{D.fmt(team.toPar)}</div>
            <div className="rank">Week {D.event?.week || 9}</div>
          </div>
        </div>
        <div className="sheet-body">
          {players.map(p => {
            const toPar = p.current_score ?? 0;
            const scoreCls = toPar < 0 ? 'under' : toPar > 0 ? 'over' : '';
            const thru = p.thru === 18 || p.thru === 'F' ? 'F' : p.thru || '-';
            const isMC = p.status === 'mc';
            const isWD = p.status === 'wd';
            
            return (
              <div key={p.name} className="sheet-player">
                <div className="sp-pos">{p.position || p.fin_text || '-'}</div>
                <div className="sp-name">
                  {p.name}
                  {isMC && <span className="status">MC{p.penalty > 0 ? ` +${p.penalty}` : ''}</span>}
                  {isWD && <span className="status">WD</span>}
                </div>
                <div className="sp-thru">{isMC || isWD ? '-' : thru}</div>
                <div className={`sp-score ${scoreCls}`}>{D.fmt(toPar)}</div>
              </div>
            );
          })}
        </div>
        <div className="sheet-footer">
          <div 
            className="sheet-btn"
            onClick={() => setFav(isFav ? null : team.owner)}
          >
            {isFav ? '★ Your Team' : '☆ Favorite'}
          </div>
          <div className="sheet-btn primary" onClick={onViewFull}>
            View Full Details →
          </div>
        </div>
      </div>
    </>
  );
}

// ═══════════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════════
function App() {
  const [theme, toggleTheme] = useTheme();
  const [view, setView] = React.useState('live'); // 'live' | 'weekly' | 'season' | 'team'
  const [selectedTeam, setSelectedTeam] = React.useState(null);
  const [sheetTeam, setSheetTeam] = React.useState(null); // For bottom sheet preview
  const [rawData, setRawData] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  
  // Load leaderboard data
  React.useEffect(() => {
    loadLeaderboard();
    const interval = setInterval(loadLeaderboard, 2 * 60 * 1000);
    return () => clearInterval(interval);
  }, []);
  
  async function loadLeaderboard() {
    try {
      const resp = await fetch(CONFIG.LEADERBOARD_URL + "?t=" + Date.now(), {
        cache: 'no-store',
        headers: { 'Pragma': 'no-cache' }
      });
      if (resp.ok) {
        const lb = await resp.json();
        setRawData(lb);
        setError(null);
      }
    } catch (err) {
      console.log("Failed to load leaderboard:", err);
      setError("Failed to load data");
    } finally {
      setLoading(false);
    }
  }
  
  // Build LP_DATA from raw leaderboard
  const data = React.useMemo(() => buildLPData(rawData), [rawData]);
  
  // Handle team selection - now opens bottom sheet instead of full page
  const handleSelectTeam = (team, newView) => {
    if (newView) {
      setView(newView);
      setSheetTeam(null);
    } else if (team) {
      setSheetTeam(team); // Open bottom sheet
    }
  };
  
  // Go to full team detail from sheet
  const handleViewFull = () => {
    if (sheetTeam) {
      setSelectedTeam(sheetTeam);
      setSheetTeam(null);
      setView('team');
    }
  };
  
  const handleBack = () => {
    setView('weekly');
    setSelectedTeam(null);
  };
  
  const handleCloseSheet = () => {
    setSheetTeam(null);
  };
  
  if (loading) {
    return (
      <>
        <style>{clubCSS}</style>
        <div className={`dir-club ${theme === 'dark' ? 'dark' : ''}`}>
          <div className="stack">
            <div className="loading">Loading...</div>
          </div>
        </div>
      </>
    );
  }
  
  if (!data) {
    return (
      <>
        <style>{clubCSS}</style>
        <div className={`dir-club ${theme === 'dark' ? 'dark' : ''}`}>
          <div className="stack">
            <div className="loading">No data available</div>
          </div>
        </div>
      </>
    );
  }
  
  return (
    <>
      <style>{clubCSS}</style>
      <div className={`dir-club ${theme === 'dark' ? 'dark' : ''}`}>
        <div className="stack">
          <ClubMasthead data={data} theme={theme} onToggleTheme={toggleTheme} />
          
          {view === 'live' && (
            <ClubhouseLive data={data} theme={theme} onSelectTeam={handleSelectTeam} />
          )}
          
          {view === 'weekly' && (
            <ClubhouseWeekly data={data} theme={theme} onSelectTeam={handleSelectTeam} />
          )}
          
          {view === 'season' && (
            <ClubhouseSeason data={data} theme={theme} onSelectTeam={handleSelectTeam} />
          )}
          
          {view === 'team' && selectedTeam && (
            <ClubhouseTeam data={data} theme={theme} team={selectedTeam} onBack={handleBack} />
          )}
        </div>
        
        <BottomSheet 
          data={data} 
          team={sheetTeam} 
          onClose={handleCloseSheet}
          onViewFull={handleViewFull}
        />
      </div>
    </>
  );
}

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
