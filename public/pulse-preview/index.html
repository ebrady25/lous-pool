// HOOKS
// ═══════════════════════════════════════════════════════════════
function useTheme() {
  const [theme, setThemeRaw] = React.useState(() => {
    try { return localStorage.getItem('lous-pool-theme') || 'light'; } catch { return 'light'; }
  });
  const setTheme = React.useCallback((t) => {
    try { localStorage.setItem('lous-pool-theme', t); } catch {}
    setThemeRaw(t);
  }, []);
  const toggle = React.useCallback(() => {
    setTheme(theme === 'light' ? 'dark' : 'light');
  }, [theme, setTheme]);
  return [theme, toggle];
}

function useFavoriteTeam() {
  const [fav, setFavRaw] = React.useState(() => {
    try { return localStorage.getItem('lous-pool-fav') || null; } catch { return null; }
  });
  const setFav = React.useCallback((owner) => {
    try {
      if (owner) localStorage.setItem('lous-pool-fav', owner);
      else localStorage.removeItem('lous-pool-fav');
    } catch {}
    setFavRaw(owner);
  }, []);
  return [fav, setFav];
}

function useLiveFlash(maxIdx, intervalMs = 4200) {
  const [flashIdx, setFlash] = React.useState(-1);
  React.useEffect(() => {
    if (maxIdx < 1) return;
    let cancelled = false;
    const tick = () => {
      if (cancelled) return;
      const idx = Math.floor(Math.pow(Math.random(), 1.6) * maxIdx);
      setFlash(idx);
      setTimeout(() => { if (!cancelled) setFlash(-1); }, 1800);
    };
    const first = setTimeout(tick, 1200);
    const interval = setInterval(tick, intervalMs);
    return () => { cancelled = true; clearTimeout(first); clearInterval(interval); };
  }, [maxIdx, intervalMs]);
  return flashIdx;
}

function useCountUp(target, duration = 900) {
  const [v, setV] = React.useState(0);
  React.useEffect(() => {
    if (target === 0) { setV(0); return; }
    const start = performance.now();
    let raf;
    const step = (now) => {
      const t = Math.min(1, (now - start) / duration);
      const eased = 1 - Math.pow(1 - t, 3);
      setV(target * eased);
      if (t < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target, duration]);
  return v;
}

// DATA ADAPTER - Maps leaderboard.json to LP_DATA format
// ═══════════════════════════════════════════════════════════════
function buildLPData(raw) {
  if (!raw || !raw.teams) return null;
  
  const fmt = (toPar) => {
    if (toPar === null || toPar === undefined) return "—";
    if (toPar === 0) return "E";
    return toPar > 0 ? `+${toPar}` : `${toPar}`;
  };
  
  const isFriend = (name) => CONFIG.FRIENDS.some(f => 
    name.toLowerCase().includes(f.toLowerCase())
  );
  
  // Sort teams for weekly ranking
  const weekSorted = [...raw.teams].sort((a, b) => 
    (a.team_to_par ?? 999) - (b.team_to_par ?? 999)
  );
  
  // Sort teams for season ranking  
  const seasonSorted = [...raw.teams].sort((a, b) => 
    (a.season_pts ?? 99999) - (b.season_pts ?? 99999)
  );
  
  // Build week array
  const week = weekSorted.map((t, i) => ({
    owner: t.owner,
    rank: i + 1,
    toPar: t.team_to_par ?? 0,
    season: t.season_pts ?? 0,
    seasonRank: t.season_rank ?? 0,
    picks: t.players?.map(p => p.name) || [],
    players: t.players || [],
    isFriend: isFriend(t.owner),
    mc: t.mc_count || 0,
  }));
  
  // Build season array
  const season = seasonSorted.map((t, i) => ({
    owner: t.owner,
    rank: i + 1,
    pts: t.season_pts ?? 0,
    weekRank: t.weekly_rank ?? 0,
    weekToPar: t.team_to_par ?? 0,
    isFriend: isFriend(t.owner),
  }));
  
  // Build live players array
  const live = (raw.live_players || []).map(p => ({
    name: p.name,
    pos: p.position || p.fin_text || "",
    thru: p.thru ?? "",
    today: p.today ?? 0,
    to: p.current_score ?? 0,
    r1: p.r1,
    r2: p.r2,
    r3: p.r3,
    r4: p.r4,
  }));
  
  // Event info
  const event = {
    name: raw.event || "Tournament",
    course: raw.course || raw.event || "Course",
    par: raw.course_par || 72,
    cut: raw.cut_line ? (raw.cut_line - (raw.course_par || 72) * 2) : null,
    round: raw.current_round || 1,
    status: raw.status || "pre",
    week: 9, // PGA Championship is Week 9
    totalWeeks: 15,
    teams: raw.total_teams || 100,
    updatedAt: raw.updated_at || raw.last_updated,
  };
  
  return {
    fmt,
    week,
    season,
    live,
    event,
    raw,
  };
}

function CountScore({ value, format }) {
  const animated = useCountUp(value, 900);
  return <span className="counting">{format ? format(animated) : Math.round(animated)}</span>;
}

function ClubMasthead({ data, theme, onToggleTheme }) {
  const event = data?.event || {};
  const isLive = event.status === 'round1' || event.status === 'round2' || 
                 event.status === 'round3' || event.status === 'round4';
  const roundNum = event.round || 1;
  
  // Format event name for display
  const eventParts = (event.name || "Tournament").split(" ");
  const lastWord = eventParts.pop();
  const firstWords = eventParts.join(" ");
  
  return (
    <div className="top">
      <div className="top-row">
        <div className="brand">
          <span className="mark">Lou's Pool</span>
          <span className="est">Wk {event.week || 9} · 2026</span>
        </div>
        <div className="top-actions">
          {isLive && <span className="pill"><span className="dot"></span>R{roundNum} · Live</span>}
          <button className="theme-btn" onClick={onToggleTheme}>
            {theme === 'dark' ? '☀️' : '🌙'}
          </button>
        </div>
      </div>
      <div className="masthead">
        <h1>{firstWords}<br/><em>{lastWord}</em></h1>
        <div className="meta">
          {event.course || "Golf Course"}<br/>
          Par <b>{event.par || 72}</b>{event.cut !== null && <> · Cut <b>{event.cut >= 0 ? '+' : ''}{event.cut}</b></>}<br/>
          <b>{event.teams || 100}</b> Teams
        </div>
      </div>
    </div>
  );
}

function ClubTabs({ active, onChange }) {
  const tabs = [
    { k: 'live', l: 'Live PGA', dot: true },
    { k: 'weekly', l: 'Weekly' },
    { k: 'season', l: 'Season' },
    { k: 'pulse', l: 'Friends' },
  ];
  return (
    <div className="tabs-row">
      {tabs.map(t => (
        <div 
          key={t.k} 
          className={`tab ${t.k === active ? 'on' : ''}`}
          onClick={() => onChange(t.k)}
        >
          {t.dot && t.k === active && <span className="live-dot"></span>}
          {t.l}
        </div>
      ))}
    </div>
  );
}

function YouPin({ team, view, data }) {
  if (!team) return null;
  const D = data;
  
  if (view === 'season') {
    const leader = D.season[0]?.pts || team.pts;
    const back = team.pts - leader;
    return (
      <div className="you-pin">
        <div>
          <div className="you-tag">★ Your Team</div>
          <div className="you-name">{team.owner}</div>
          <div className="you-back">Season · #{team.rank} of 100</div>
        </div>
        <div style={{textAlign:'right'}}>
          <div className="you-rank">#{team.rank}</div>
          <div className="you-back">{team.pts?.toLocaleString()} pts{back > 0 ? ` · +${back} back` : ' · leader'}</div>
        </div>
      </div>
    );
  }
  
  // Weekly view
  const cls = team.toPar < 0 ? 'under' : team.toPar > 0 ? 'over' : 'even';
  const leader = D.week[0]?.toPar || 0;
  const back = team.toPar - leader;
  
  return (
    <div className="you-pin">
      <div>
        <div className="you-tag">★ Your Team</div>
        <div className="you-name">{team.owner}</div>
        <div className="you-back">Week {D.event?.week || 9} · {team.rank === 1 ? 'Leader' : `#${team.rank} of 100`}</div>
      </div>
      <div style={{textAlign:'right'}}>
        <div className={`you-sc ${cls}`}>{D.fmt(team.toPar)}</div>
        <div className="you-back">{team.rank === 1 ? 'Leading' : `+${back} back`}</div>
      </div>
    </div>
  );
}

// Live PGA View
function ClubhouseLive({ data, theme, onSelectTeam }) {
  const D = data;
  const [fav] = useFavoriteTeam();
  const flashIdx = useLiveFlash(D.live.length);
  
  // Build set of players owned by friends and favorite team
  const friendOwned = new Set();
  const myOwned = new Set();
  D.week.forEach(team => {
    if (team.isFriend) team.picks?.forEach(p => friendOwned.add(p));
    if (fav && team.owner === fav) team.picks?.forEach(p => myOwned.add(p));
  });
  
  return (
    <div className="scroll">
      <ClubTabs active="live" onChange={(v) => onSelectTeam(null, v)} />
      
      <div className="section-title">
        <h2>PGA Tour Leaderboard</h2>
      </div>
      
      <div className="live-lb">
        {D.live.map((p, i) => {
          const isMine = myOwned.has(p.name);
          const isFriendPlayer = friendOwned.has(p.name);
          const todayCls = p.today < 0 ? 'under' : p.today > 0 ? 'over' : '';
          const totCls = p.to < 0 ? 'under' : p.to > 0 ? 'over' : '';
          
          return (
            <div 
              key={p.name} 
              className={`lp-row ${flashIdx === i ? 'flash' : ''} ${isMine ? 'is-mine' : ''} ${isFriendPlayer && !isMine ? 'is-friend' : ''}`}
            >
              <div className="lp-pos">{p.pos}</div>
              <div className="lp-name">
                {p.name}
                {isMine && <span className="mine-star">★</span>}
                {isFriendPlayer && !isMine && <span className="friend-star">☆</span>}
              </div>
              <div className="lp-thru">{p.thru === 18 || p.thru === 'F' ? 'F' : p.thru || '-'}</div>
              <div className={`lp-today ${todayCls}`}>{D.fmt(p.today)}</div>
              <div className={`lp-tot ${totCls}`}>{D.fmt(p.to)}</div>
            </div>
          );
        })}
        {D.live.length === 0 && (
          <div className="loading">No live data available</div>
        )}
      </div>
      <div style={{height: 24}}></div>
    </div>
  );
}

// Team Detail View
function ClubhouseTeam({ data, theme, team, onBack }) {
  const D = data;
  const [fav, setFav] = useFavoriteTeam();
  const isFav = fav === team.owner;
  
  const players = team.players || [];
  
  const bestRound = (p) => {
    const rounds = [p.r1, p.r2, p.r3, p.r4].filter(r => r != null);
    if (rounds.length === 0) return -1;
    const min = Math.min(...rounds);
    return [p.r1, p.r2, p.r3, p.r4].indexOf(min);
  };
  
  // Calculate round totals
  const roundTotals = [0, 0, 0, 0];
  let hasRounds = false;
  players.forEach(p => {
    if (p.r1 != null) { roundTotals[0] += p.r1; hasRounds = true; }
    if (p.r2 != null) { roundTotals[1] += p.r2; }
    if (p.r3 != null) { roundTotals[2] += p.r3; }
    if (p.r4 != null) { roundTotals[3] += p.r4; }
  });
  
  return (
    <div className="scroll">
      <div className="hero">
        <div className="back" onClick={onBack}>← Pool Standings</div>
        <h1>{team.owner}</h1>
        <div className="alias">
          {team.rank === 1 ? `Week ${D.event?.week || 9} Leader · ${D.event?.name || 'Tournament'}` : `Wk ${D.event?.week || 9} · #${team.rank} of 100`}
        </div>
        <div className="nums">
          <div className="num lg">
            <div className="k">This Week</div>
            <div className="v">
              <CountScore value={team.toPar} format={(n) => D.fmt(Math.round(n))} />
            </div>
            <div className="sub">{team.rank === 1 ? '1st place' : `#${team.rank} of 100`}</div>
          </div>
          <div className="num">
            <div className="k">Season</div>
            <div className="v" style={{color: theme === 'dark' ? 'rgba(242,234,212,0.85)' : 'rgba(246,241,227,0.85)'}}>
              {team.season?.toLocaleString()}
            </div>
            <div className="sub">#{team.seasonRank}</div>
          </div>
        </div>
        <div 
          className={`fav-toggle ${isFav ? 'on' : ''}`}
          onClick={() => setFav(isFav ? null : team.owner)}
        >
          <span className="star">{isFav ? '★' : '☆'}</span>
          {isFav ? 'Your Team' : 'Favorite this team'}
        </div>
      </div>
      
      <div style={{padding: '14px 22px 4px', fontFamily: 'DM Mono', fontSize: '9px', letterSpacing: '0.18em', textTransform: 'uppercase', color: 'var(--ink-soft)', borderBottom: '1px solid var(--paper-line)'}}>
        Roster · {players.length} Players{D.event?.status?.includes('round4') ? ' · Final' : ''}
      </div>
      
      {players.map(p => {
        const toPar = p.current_score ?? 0;
        const best = bestRound(p);
        const owned = Math.round((Math.random() * 60) + 5); // Placeholder ownership %
        
        return (
          <div key={p.name} className="player-card">
            <div className="pc-top">
              <div>
                <div className="pc-nm">{p.name}</div>
                <div className="pc-pos">
                  {(p.position && p.position !== 'WAITING' ? p.position : p.fin_text || '') || ''}{(p.position && p.position !== 'WAITING') || p.fin_text ? ' · ' : ''}{D.event?.course || 'Course'}
                  {p.status === 'mc' && ' · MC'}
                  {p.penalty > 0 && ` · +${p.penalty}`}
                </div>
              </div>
              <div 
                className="pc-sc" 
                style={{color: toPar < 0 ? 'var(--green-good)' : toPar > 0 ? 'var(--brick)' : 'var(--ink)'}}
              >
                {D.fmt(toPar)}
              </div>
            </div>
            {hasRounds && (
              <div className="pc-rounds">
                {[0, 1, 2, 3].map(i => {
                  const r = [p.r1, p.r2, p.r3, p.r4][i];
                  return (
                    <div key={i} className={`r ${i === best ? 'best' : ''}`}>
                      <div className="k">R{i + 1}</div>
                      <div className="v">{r ?? '-'}</div>
                    </div>
                  );
                })}
              </div>
            )}
          </div>
        );
      })}
      
      {hasRounds && (
        <div style={{margin: '14px 22px 0', padding: '12px 14px', background: 'var(--paper-deep)', border: '1px solid var(--paper-line)'}}>
          <div style={{fontFamily: 'DM Mono', fontSize: '9px', letterSpacing: '0.18em', textTransform: 'uppercase', color: 'var(--ink-soft)', marginBottom: 8}}>
            Team Total · Round-by-Round
          </div>
          <div style={{display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 8, fontFamily: 'Fraunces', fontVariantNumeric: 'tabular-nums'}}>
            {['R1', 'R2', 'R3', 'R4', 'TOT'].map((k, i) => (
              <div key={k} style={{textAlign: 'center'}}>
                <div style={{fontFamily: 'DM Mono', fontSize: '9px', color: 'var(--ink-faint)', letterSpacing: '0.18em'}}>{k}</div>
                <div style={{fontSize: '18px', fontWeight: 500, color: i === 4 ? 'var(--green-good)' : 'var(--ink)'}}>
                  {i < 4 ? (roundTotals[i] || '-') : D.fmt(team.toPar)}
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
      
      <div style={{height: 32}}></div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════════
// FRIENDS - live bubble chart + history line chart + mini leaderboard
// ═══════════════════════════════════════════════════════════════
function ClubhousePulse({ data, theme, onSelectTeam, history }) {
  const D = data;
  const [fav, setFav] = useFavoriteTeam();
  // Within-round scale persistence (one-way expansion until round changes)
  const scaleRef = React.useRef({ round: null, minS: null, maxS: null });
  if (!D) return null;
  
  // ═════════════ FRIENDS POOL (PULSE_OWNERS + Connor) ═════════════
  // PULSE_OWNERS already includes Ethan + 6 tracked friends.
  // We add Connor here to evaluate as a potential outlier, then filter
  // outliers OUT of the bubble stage and pin them to the bottom edge instead.
  const ALL_FRIENDS = [...CONFIG.PULSE_OWNERS, "Connor White"];
  const allFriendTeams = ALL_FRIENDS
    .map(owner => D.week.find(t => t.owner === owner))
    .filter(Boolean);
  
  if (allFriendTeams.length === 0) {
    return (
      <div className="scroll">
        <ClubTabs active="pulse" onChange={(v) => onSelectTeam(null, v)} />
        <div className="pulse-wrap">
          <div className="pulse-title"><span className="live-dot"></span>Friends · Live</div>
          <div style={{padding: '40px 22px', textAlign: 'center', color: 'var(--ink-faint)', fontFamily: 'DM Mono', fontSize: 12}}>
            No friend teams loaded yet.
          </div>
        </div>
      </div>
    );
  }
  
  // ═════════════ AUTO-DETECT OUTLIERS ═════════════
  // Asymmetric on purpose: only pin teams that are way WORSE than the pack,
  // never teams that are way BETTER. (A friend on a heater should fill the
  // stage, not get pushed off-scale.) Walks from the worst score upward;
  // each team is an outlier if the gap to the next-worst exceeds the
  // threshold; the walk stops at the first non-outlier.
  const OUTLIER_GAP = 10;
  const sortedDesc = [...allFriendTeams].sort((a, b) => (b.toPar ?? 0) - (a.toPar ?? 0));
  const outlierSet = new Set();
  for (let i = 0; i < sortedDesc.length - 1; i++) {
    const gap = (sortedDesc[i].toPar ?? 0) - (sortedDesc[i + 1].toPar ?? 0);
    if (gap > OUTLIER_GAP) {
      outlierSet.add(sortedDesc[i].owner);
    } else {
      break; // once a non-outlier is found, stop the walk
    }
  }
  
  // teams (on-stage) and outliers (pinned)
  const teams = allFriendTeams.filter(t => !outlierSet.has(t.owner));
  const outliers = allFriendTeams.filter(t => outlierSet.has(t.owner));
  
  // ═════════════ STAGE SCALE ═════════════
  // Rules:
  //   1. Snap min/max to nearest 5 strokes (round outward)
  //   2. Minimum range = 20 strokes (small clusters don't get cramped)
  //   3. One-way expansion *within the current round* (no whiplash from
  //      single shots; resets when current_round changes)
  const SNAP = 5;
  const MIN_RANGE = 20;
  
  const onStageScores = teams.map(t => t.toPar ?? 0);
  let rawMin = onStageScores.length ? Math.min(...onStageScores) : -5;
  let rawMax = onStageScores.length ? Math.max(...onStageScores) : 5;
  
  // Step 1: snap outward to nearest 5
  let snapMin = Math.floor(rawMin / SNAP) * SNAP;
  let snapMax = Math.ceil(rawMax / SNAP) * SNAP;
  
  // Step 2: enforce minimum range, centered
  if (snapMax - snapMin < MIN_RANGE) {
    const center = (snapMin + snapMax) / 2;
    // Re-snap an expanded window to the grid
    snapMin = Math.floor((center - MIN_RANGE / 2) / SNAP) * SNAP;
    snapMax = Math.ceil((center + MIN_RANGE / 2) / SNAP) * SNAP;
  }
  
  // Step 3: one-way expansion within current round (held in a ref keyed by round)
  const currentRound = D.event?.round ?? 0;
  if (scaleRef.current.round !== currentRound || scaleRef.current.minS === null) {
    // New round (or first render) → reset to fresh-computed snap
    scaleRef.current = { round: currentRound, minS: snapMin, maxS: snapMax };
  } else {
    // Same round → only allow expansion, never contraction
    scaleRef.current.minS = Math.min(scaleRef.current.minS, snapMin);
    scaleRef.current.maxS = Math.max(scaleRef.current.maxS, snapMax);
  }
  
  const minS = scaleRef.current.minS;
  const maxS = scaleRef.current.maxS;
  
  // Stage layout: vertical = score, horizontal = stable per-team column slots so bubbles don't overlap at same score
  const STAGE_HEIGHT = 520;
  const STAGE_TOP_PAD = 30;
  const STAGE_BOT_PAD = 30;
  const AXIS_WIDTH = 36;
  const BUBBLE_SIZE = 36;
  const usableHeight = STAGE_HEIGHT - STAGE_TOP_PAD - STAGE_BOT_PAD;
  
  // Score → Y position (best at top → lower Y)
  const scoreToY = (s) => {
    const t = (s - minS) / (maxS - minS); // 0 at minS (best), 1 at maxS (worst)
    return STAGE_TOP_PAD + t * usableHeight;
  };
  
  // Build axis ticks (snapped to multiples of 5 to match the scale grid)
  const axisTicks = [];
  for (let s = minS; s <= maxS; s += SNAP) {
    axisTicks.push(s);
  }
  
  // Bubble color logic from MC count
  const colorFor = (mc) => mc === 0 ? 'green' : mc === 1 ? 'yellow' : 'red';
  
  // Determine bubble color per team
  const teamMC = (team) => {
    return (team.players || []).filter(p => p.status === 'mc').length;
  };
  
  // Spread bubbles horizontally — each team gets a stable column slot
  // but if two teams have same score, they offset slightly
  const positioned = (() => {
    const stageW = Math.max(280, (window.innerWidth || 380) - AXIS_WIDTH - 16);
    // Group by score (rounded) so co-located teams get spread
    const byScore = {};
    teams.forEach((t, i) => {
      const key = t.toPar;
      if (!byScore[key]) byScore[key] = [];
      byScore[key].push({ team: t, idx: i });
    });
    
    const result = [];
    teams.forEach((t, i) => {
      const cluster = byScore[t.toPar];
      const clusterIdx = cluster.findIndex(x => x.idx === i);
      const clusterSize = cluster.length;
      
      // Even spread inside the stage
      const stageCenterX = (stageW - BUBBLE_SIZE) / 2;
      const spreadX = clusterSize === 1 
        ? stageCenterX
        : (stageW - BUBBLE_SIZE) * (0.18 + (clusterIdx / Math.max(1, clusterSize - 1)) * 0.64);
      
      // Add a tiny per-team stable offset so colocated bubbles don't perfectly stack
      const teamHash = t.owner.split('').reduce((a, c) => a + c.charCodeAt(0), 0);
      const stableOffset = ((teamHash % 7) - 3) * 6;
      
      result.push({
        team: t,
        x: spreadX + stableOffset,
        y: scoreToY(t.toPar) - BUBBLE_SIZE / 2,
        mc: teamMC(t),
        isFav: t.owner === fav,
      });
    });
    return result;
  })();
  
  // ── STOCK CHART ──
  // Show only the LAST 4 updates so the chart stays focused on the recent trail.
  const snaps = (history?.snapshots || []).slice(-4);
  const chartW = 360;
  const chartH = 240;
  const chartPadL = 8;
  const chartPadR = 30;
  const chartPadT = 12;
  const chartPadB = 18;
  
  // Chart scale: own rules, based only on on-stage friends across the 4 snapshots.
  // Same shape as stage rules (snap-to-5) but tighter min range since only
  // 4 points need to fit and we want the trail to feel readable.
  const CHART_MIN_RANGE = 10;
  const onStageOwners = new Set(teams.map(t => t.owner));
  let chartRawMin = Infinity, chartRawMax = -Infinity;
  snaps.forEach(snap => {
    Object.entries(snap.scores || {}).forEach(([owner, v]) => {
      if (!onStageOwners.has(owner)) return; // exclude outliers from scale calc
      if (typeof v !== 'number') return;
      if (v < chartRawMin) chartRawMin = v;
      if (v > chartRawMax) chartRawMax = v;
    });
  });
  // Sensible defaults if we have no data
  if (!isFinite(chartRawMin)) { chartRawMin = -5; chartRawMax = 5; }
  
  let hMin = Math.floor(chartRawMin / SNAP) * SNAP;
  let hMax = Math.ceil(chartRawMax / SNAP) * SNAP;
  if (hMax - hMin < CHART_MIN_RANGE) {
    const center = (hMin + hMax) / 2;
    hMin = Math.floor((center - CHART_MIN_RANGE / 2) / SNAP) * SNAP;
    hMax = Math.ceil((center + CHART_MIN_RANGE / 2) / SNAP) * SNAP;
  }
  
  const xAt = (i) => chartPadL + (i / Math.max(1, snaps.length - 1)) * (chartW - chartPadL - chartPadR);
  // lower score (better) at top
  const yAt = (s) => chartPadT + ((s - hMin) / (hMax - hMin)) * (chartH - chartPadT - chartPadB);
  
  // Gridline scores at the same 5-stroke snap as the chart bounds
  const gridScores = [];
  for (let s = hMin; s <= hMax; s += SNAP) {
    gridScores.push(s);
  }
  
  // Color palette per friend (distinct, readable)
  const palette = {
    "Ethan Brady": "#c9a85e",       // brass (you)
    "Eric Southard": "#2d6e3e",
    "Connor White": "#8a2a1e",
    "Great White!": "#3d6b8a",
    "John Hughes": "#a07814",
    "Matt White": "#5a4282",
    "Aaron White": "#7d5a3a",
    "Joe Jurkiewicz": "#2f7d7a",   // teal
  };
  
  return (
    <div className="scroll">
      <ClubTabs active="pulse" onChange={(v) => onSelectTeam(null, v)} />
      
      <div className="pulse-wrap">
      <div className="pulse-header">
        <div className="pulse-title-inline">
          <span className="live-dot"></span>
          Friends · Live · {teams.length} teams
        </div>
        <div className="pulse-legend-inline">
          <span className="lg green"><span className="dot"></span>4/4</span>
          <span className="lg yellow"><span className="dot"></span>MC</span>
          <span className="lg red"><span className="dot"></span>2+</span>
        </div>
      </div>
      
      <div className="pulse-stage">
        {/* Ambient depth — drifting orbs */}
        <div className="pulse-orb o1"></div>
        <div className="pulse-orb o2"></div>
        <div className="pulse-orb o3"></div>
        <div className="pulse-orb o4"></div>
        
        {/* Axis on right */}
        <div className="pulse-axis">
          {axisTicks.map(s => (
            <React.Fragment key={s}>
              <div 
                className={`pulse-tick ${s === 0 ? 'zero' : ''}`}
                style={{top: `${scoreToY(s)}px`}}
              />
              <div 
                className="pulse-tick-label"
                style={{top: `${scoreToY(s)}px`}}
              >
                {s === 0 ? 'E' : s > 0 ? `+${s}` : s}
              </div>
            </React.Fragment>
          ))}
        </div>
        
        {/* Bubbles */}
        {positioned.map(({ team, x, y, mc, isFav }) => {
          const cls = colorFor(mc);
          const score = team.toPar === 0 ? 'E' : team.toPar > 0 ? `+${team.toPar}` : `${team.toPar}`;
          return (
            <div
              key={team.owner}
              className={`pulse-bubble ${cls} ${isFav ? 'me' : ''}`}
              style={{ left: `${x}px`, top: `${y}px` }}
              onClick={() => onSelectTeam(team)}
              title={`${team.owner} · ${score}`}
            >
              {score}
            </div>
          );
        })}
        
        {/* Outlier bubbles — pinned to bottom of stage (off-scale) */}
        {outliers.map((team, i) => {
          const mc = teamMC(team);
          const cls = colorFor(mc);
          const isFav = team.owner === fav;
          const score = team.toPar === 0 ? 'E' : team.toPar > 0 ? `+${team.toPar}` : `${team.toPar}`;
          // Center horizontally with small per-team offset; pin to bottom edge
          const stageW = Math.max(280, (window.innerWidth || 380) - AXIS_WIDTH - 16);
          const x = (stageW - BUBBLE_SIZE) / 2 + (i * 44) - ((outliers.length - 1) * 22);
          const y = STAGE_HEIGHT - BUBBLE_SIZE - 8;
          return (
            <div
              key={team.owner}
              className={`pulse-bubble ${cls} ${isFav ? 'me' : ''} outlier`}
              style={{ left: `${x}px`, top: `${y}px` }}
              onClick={() => onSelectTeam(team)}
              title={`${team.owner} · ${score} (off-scale)`}
            >
              {score}
            </div>
          );
        })}
      </div>
      
      {/* ── FRIENDS MINI LEADERBOARD (between stage and chart) ── */}
      <div className="lb lb-friends" style={{marginTop: 12}}>
        {(() => {
          const rows = CONFIG.FRIENDS_LB
            .map(owner => D.week.find(t => t.owner === owner))
            .filter(Boolean)
            .sort((a, b) => (a.toPar ?? 999) - (b.toPar ?? 999));
          
          return rows.map(team => {
            const isFav = team.owner === fav;
            const cls = team.toPar < 0 ? 'under' : team.toPar > 0 ? 'over' : 'even';
            const subText = isFav 
              ? 'Your Team' 
              : 'Tracked';
            return (
              <div 
                key={team.owner}
                className={`lb-row ${isFav ? 'is-fav' : ''}`}
                onClick={() => onSelectTeam(team)}
              >
                <div className="pos">{team.rank}</div>
                <div className="who" style={{display: 'flex', alignItems: 'center', gap: 6}}>
                  <span 
                    className={`fav-btn ${isFav ? 'on' : ''}`}
                    onClick={(e) => { e.stopPropagation(); setFav(isFav ? null : team.owner); }}
                  >
                    {isFav ? '★' : '☆'}
                  </span>
                  <div>
                    <div className="nm">{team.owner}</div>
                    <div className="sub">{subText}</div>
                  </div>
                </div>
                <div className="delta"></div>
                <div className={`score ${cls}`}>{D.fmt(team.toPar)}</div>
              </div>
            );
          });
        })()}
      </div>
      
      {/* Stock chart */}
      <div className="pulse-chart">
        <div style={{fontFamily: 'DM Mono', fontSize: 10, letterSpacing: '0.22em', textTransform: 'uppercase', color: 'var(--ink-soft)', marginBottom: 8}}>
          Last {snaps.length} updates · score trail
        </div>
        <svg viewBox={`0 0 ${chartW} ${chartH}`} preserveAspectRatio="none">
          {/* Gridlines at each integer score — matches stage axis ticks */}
          {gridScores.map(s => (
            <g key={`grid-${s}`}>
              <line
                x1={chartPadL}
                x2={chartW - chartPadR}
                y1={yAt(s)} y2={yAt(s)}
                stroke={s === 0 ? 'var(--ink-soft)' : 'var(--paper-line)'}
                strokeWidth={s === 0 ? 0.6 : 0.4}
                strokeDasharray={s === 0 ? '2,3' : 'none'}
                opacity={s === 0 ? 0.5 : 0.35}
              />
            </g>
          ))}
          {/* Per-friend score line */}
          {CONFIG.PULSE_OWNERS.map(owner => {
            const pts = snaps
              .map((s, i) => {
                const v = s.scores?.[owner];
                return typeof v === 'number' ? `${xAt(i)},${yAt(v)}` : null;
              })
              .filter(Boolean);
            if (pts.length < 2) return null;
            const color = palette[owner] || '#5b5b50';
            const isMe = owner === fav;
            return (
              <g key={owner}>
                <polyline
                  points={pts.join(' ')}
                  fill="none"
                  stroke={color}
                  strokeWidth={isMe ? 2.2 : 1.4}
                  strokeLinecap="round"
                  strokeLinejoin="round"
                  opacity={isMe ? 1 : 0.75}
                />
                {/* End dot */}
                {pts.length > 0 && (() => {
                  const [lx, ly] = pts[pts.length - 1].split(',').map(parseFloat);
                  return (
                    <circle 
                      cx={lx} cy={ly} 
                      r={isMe ? 3.2 : 2.4} 
                      fill={color}
                      stroke="var(--paper)"
                      strokeWidth={isMe ? 1 : 0.5}
                    />
                  );
                })()}
              </g>
            );
          })}
          {/* Right-edge gridline labels — same scores as stage axis, right-justified */}
          {gridScores.map(s => (
            <text 
              key={`lbl-${s}`}
              x={chartW} 
              y={yAt(s) + 3}
              textAnchor="end"
              fontSize="9"
              fontFamily="DM Mono, monospace"
              fill="var(--ink-soft)"
              opacity={s === 0 ? 1 : 0.7}
              style={{fontVariantNumeric: 'tabular-nums'}}
            >
              {s === 0 ? 'E' : s > 0 ? `+${s}` : s}
            </text>
          ))}
        </svg>
        <div className="pulse-chart-legend">
          {CONFIG.PULSE_OWNERS.map(o => {
            const t = D.week.find(x => x.owner === o);
            if (!t) return null;
            const nick = CONFIG.PULSE_NICKNAMES[o] || o.split(' ')[0];
            return (
              <div key={o} className="lg" style={{color: o === fav ? 'var(--ink)' : 'var(--ink-soft)'}}>
                <span className="sw" style={{background: palette[o] || '#5b5b50'}}></span>
                {nick} {D.fmt(t.toPar)}
              </div>
            );
          })}
        </div>
      </div>
      
      <div style={{height: 24}}></div>
      </div>
    </div>
  );
}


// ═══════════════════════════════════════════════════════════════
// BOTTOM SHEET - Quick team preview
// ═══════════════════════════════════════════════════════════════
function BottomSheet({ data, team, onClose, onViewFull }) {
  const D = data;
  const [fav, setFav] = useFavoriteTeam();
  const [expandedPlayer, setExpandedPlayer] = React.useState(null);
  const isFav = team && fav === team.owner;
  
  // Close on escape key
  React.useEffect(() => {
    const handleKey = (e) => { if (e.key === 'Escape') onClose(); };
    window.addEventListener('keydown', handleKey);
    return () => window.removeEventListener('keydown', handleKey);
  }, [onClose]);
  
  // Reset expansion when team changes
  React.useEffect(() => { setExpandedPlayer(null); }, [team?.owner]);
  
  if (!team) return null;
  
  // Build replacement-player lookup so MC players can show their Rule 4's R3/R4
  const repLookup = {};
  (D.raw?.replacement_players || []).forEach(rp => {
    if (rp?.name) repLookup[rp.name] = rp;
  });
  
  const players = team.players || [];
  const cls = team.toPar < 0 ? 'under' : team.toPar > 0 ? 'over' : 'even';
  
  return (
    <>
      <div className={`sheet-overlay ${team ? 'open' : ''}`} onClick={onClose} />
      <div className={`sheet ${team ? 'open' : ''}`}>
        <div className="sheet-handle" onClick={onClose} />
        <div className="sheet-header">
          <div className="sh-left">
            <div className="sh-name">{team.owner}</div>
            <div className="sh-sub">
              #{team.rank} of 100 · {team.mc > 0 ? `${team.mc} MC · ` : ''}Season #{team.seasonRank}
            </div>
          </div>
          <div className="sh-score">
            <div className={`big ${cls}`}>{D.fmt(team.toPar)}</div>
            <div className="rank">Week {D.event?.week || 9}</div>
          </div>
        </div>
        <div className="sheet-body">
          {players.map(p => {
            const toPar = p.current_score ?? 0;
            const scoreCls = toPar < 0 ? 'under' : toPar > 0 ? 'over' : '';
            const thru = p.thru === 18 || p.thru === 'F' ? 'F' : p.thru || '-';
            const isMC = p.status === 'mc';
            const isWD = p.status === 'wd' || p.status === 'wd_alt' || p.status === 'wd_rule4' || p.status === 'wd_alt_mc';
            
            const posDisplay = (p.position === 'WAITING' || !p.position) 
              ? (p.fin_text || '-') 
              : p.position;
            
            const isExpanded = expandedPlayer === p.name;
            
            // Round-by-round source: if MC, pull R3/R4 from replacement
            const rep = isMC && p.replacement ? repLookup[p.replacement] : null;
            const r1 = p.r1;
            const r2 = p.r2;
            const r3 = isMC ? (rep?.r3 ?? null) : p.r3;
            const r4 = isMC ? (rep?.r4 ?? null) : p.r4;
            const repShort = p.replacement ? p.replacement.split(', ').reverse().join(' ') : null;
            
            return (
              <React.Fragment key={p.name}>
                <div 
                  className="sheet-player tappable" 
                  onClick={() => setExpandedPlayer(isExpanded ? null : p.name)}
                >
                  <div className="sp-pos">{posDisplay}</div>
                  <div className="sp-name">
                    {p.name}
                    {isMC && <span className="status">MC{p.penalty > 0 ? ` +${p.penalty}` : ''}</span>}
                    {isWD && <span className="status">WD</span>}
                  </div>
                  <div className="sp-thru">{isMC || isWD ? '-' : thru}</div>
                  <div className={`sp-score ${scoreCls}`}>{D.fmt(toPar)}</div>
                </div>
                {isExpanded && (
                  <div className="sp-rounds">
                    {[
                      { label: 'R1', val: r1, rep: false },
                      { label: 'R2', val: r2, rep: false },
                      { label: 'R3', val: r3, rep: isMC },
                      { label: 'R4', val: r4, rep: isMC },
                    ].map(rd => {
                      const par = D.event?.par || 70;
                      const tp = rd.val != null ? rd.val - par : null;
                      const tpCls = tp == null ? '' : tp < 0 ? 'tp-under' : tp > 0 ? 'tp-over' : 'tp-even';
                      const tpStr = tp == null ? '' : tp === 0 ? 'E' : tp > 0 ? `+${tp}` : `${tp}`;
                      return (
                        <div key={rd.label} className="rd">
                          <div className="rd-label">{rd.label}</div>
                          <div className={`rd-val ${rd.val == null ? 'empty' : ''} ${rd.rep && rd.val != null ? 'r4-rep' : ''}`}>
                            {rd.val ?? '–'}
                            {tpStr && <span className={`rd-tp ${tpCls}`}>{tpStr}</span>}
                          </div>
                        </div>
                      );
                    })}
                    {isMC && repShort && (
                      <div className="rd-note">R3/R4 by<br/>{repShort}</div>
                    )}
                  </div>
                )}
              </React.Fragment>
            );
          })}
        </div>
        <div className="sheet-footer">
          <div 
            className="sheet-btn"
            onClick={() => setFav(isFav ? null : team.owner)}
          >
            {isFav ? '★ Your Team' : '☆ Favorite'}
          </div>
          <div className="sheet-btn primary" onClick={onViewFull}>
            View Full Details →
          </div>
        </div>
      </div>
    </>
  );
}

// ═══════════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════════
function App() {
  const [theme, toggleTheme] = useTheme();
  const [view, setView] = React.useState('pulse'); // PREVIEW: defaults to pulse tab
  const [selectedTeam, setSelectedTeam] = React.useState(null);
  const [sheetTeam, setSheetTeam] = React.useState(null); // For bottom sheet preview
  const [rawData, setRawData] = React.useState(null);
  const [history, setHistory] = React.useState(null);
  const [loading, setLoading] = React.useState(true);
  const [error, setError] = React.useState(null);
  
  // Load leaderboard data
  React.useEffect(() => {
    loadLeaderboard();
    loadHistory();
    const interval = setInterval(() => {
      loadLeaderboard();
      loadHistory();
    }, 2 * 60 * 1000);
    return () => clearInterval(interval);
  }, []);
  
  async function loadLeaderboard() {
    try {
      const resp = await fetch(CONFIG.LEADERBOARD_URL + "?t=" + Date.now(), {
        cache: 'no-store',
        headers: { 'Pragma': 'no-cache' }
      });
      if (resp.ok) {
        const lb = await resp.json();
        setRawData(lb);
        setError(null);
      }
    } catch (err) {
      console.log("Failed to load leaderboard:", err);
      setError("Failed to load data");
    } finally {
      setLoading(false);
    }
  }
  
  async function loadHistory() {
    try {
      const resp = await fetch(CONFIG.HISTORY_URL + "?t=" + Date.now(), {
        cache: 'no-store',
        headers: { 'Pragma': 'no-cache' }
      });
      if (resp.ok) {
        const h = await resp.json();
        setHistory(h);
      }
    } catch (err) {
      // History is optional, fail silently
      console.log("No history available:", err);
    }
  }
  
  // Build LP_DATA from raw leaderboard
  const data = React.useMemo(() => buildLPData(rawData), [rawData]);
  
  // Handle team selection - now opens bottom sheet instead of full page
  const handleSelectTeam = (team, newView) => {
    if (newView) {
      setView(newView);
      setSheetTeam(null);
    } else if (team) {
      setSheetTeam(team); // Open bottom sheet
    }
  };
  
  // Go to full team detail from sheet
  const handleViewFull = () => {
    if (sheetTeam) {
      setSelectedTeam(sheetTeam);
      setSheetTeam(null);
      setView('team');
    }
  };
  
  const handleBack = () => {
    setView('weekly');
    setSelectedTeam(null);
  };
  
  const handleCloseSheet = () => {
    setSheetTeam(null);
  };
  
  if (loading) {
    return (
      <>
        <style>{clubCSS}</style>
        <div className={`dir-club ${theme === 'dark' ? 'dark' : ''}`}>
          <div className="stack">
            <div className="loading">Loading...</div>
          </div>
        </div>
      </>
    );
  }
  
  if (!data) {
    return (
      <>
        <style>{clubCSS}</style>
        <div className={`dir-club ${theme === 'dark' ? 'dark' : ''}`}>
          <div className="stack">
            <div className="loading">No data available</div>
          </div>
        </div>
      </>
    );
  }
  
  return (
    <>
      <style>{clubCSS}</style>
      <div className={`dir-club ${theme === 'dark' ? 'dark' : ''}`}>
        <div className="stack">
          <ClubMasthead data={data} theme={theme} onToggleTheme={toggleTheme} />
          
          {view === 'live' && (
            <ClubhouseLive data={data} theme={theme} onSelectTeam={handleSelectTeam} />
          )}
          
          {view === 'weekly' && (
            <ClubhouseWeekly data={data} theme={theme} onSelectTeam={handleSelectTeam} />
          )}
          
          {view === 'pulse' && (
            <ClubhousePulse data={data} theme={theme} onSelectTeam={handleSelectTeam} history={history} />
          )}
          
          {view === 'season' && (
            <ClubhouseSeason data={data} theme={theme} onSelectTeam={handleSelectTeam} />
          )}
          
          {view === 'team' && selectedTeam && (
            <ClubhouseTeam data={data} theme={theme} team={selectedTeam} onBack={handleBack} />
          )}
        </div>
        
        <BottomSheet 
          data={data} 
          team={sheetTeam} 
          onClose={handleCloseSheet}
          onViewFull={handleViewFull}
        />
      </div>
    </>
  );
}

// ═══════════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════════
const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
