name: Update Leaderboard

on:
  schedule:
    # Every 10 minutes during tournament hours (Thu-Sun, 11am-23pm UTC = 6am-6pm ET)
    - cron: '*/10 11-23 * * 4,5,6,0'
    # Late night coverage
    - cron: '*/10 0-2 * * 5,6,0,1'
  workflow_dispatch:

concurrency:
  group: leaderboard-update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-scores:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch scores and build leaderboard
        env:
          DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
        run: |
          python scripts/score_engine.py \
            --output public/data/leaderboard.json \
            --rosters data/rosters.json \
            --season data/season.json || echo "⚠️ No active tournament - skipping score update"

      - name: Commit updated leaderboard
        run: |
          git config user.name "BirdieBuddy Bot"
          git config user.email "birdibuddy@users.noreply.github.com"
          git add public/data/leaderboard.json
          git diff --staged --quiet || git commit -m "🏌️ Update leaderboard $(date -u +%H:%M)"
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
