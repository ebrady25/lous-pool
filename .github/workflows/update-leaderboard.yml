name: Update Leaderboard

on:
  # Scheduled: Every 15 min Thu-Sun during tournament hours (7am-8pm ET)
  schedule:
    - cron: '*/15 11-23 * * 4-7'  # UTC = ET+5 (roughly 6am-6pm ET)
    - cron: '*/15 0-1 * * 5-0'    # Late coverage (7-8pm ET on tournament days)
  
  # Manual trigger
  workflow_dispatch:

  # On push to main (deploy updates)
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'public/**'
      - 'scripts/**'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-scores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch scores and build leaderboard
        env:
          DATAGOLF_API_KEY: ${{ secrets.DATAGOLF_API_KEY }}
        run: |
          python scripts/score_engine.py \
            --output public/data/leaderboard.json \
            --rosters data/rosters.json \
            --season data/season.json

      - name: Commit updated leaderboard
        run: |
          git config user.name "BirdieBuddy Bot"
          git config user.email "birdibuddy@users.noreply.github.com"
          git add public/data/leaderboard.json
          git diff --staged --quiet || git commit -m "🏌️ Update leaderboard $(date -u +%H:%M)"
          git push

  deploy:
    needs: update-scores
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # Get latest after score update

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
